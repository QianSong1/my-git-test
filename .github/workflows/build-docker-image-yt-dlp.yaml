name: build-docker-image-yt-dlp

on:
  workflow_dispatch:
    inputs:
      IMAGE_NAME:
        description: "生成的镜像名称"
        required: true
        default: "yt-dlp"
      IMAGE_VERSION:
        description: "生成的镜像版本"
        required: true
        default: "latest"
      TARGET_REGISTRY:
        description: "保存镜像的仓库地址"
        required: true
        default: "registry.cn-hangzhou.aliyuncs.com"
      TARGET_REPOSITORY:
        description: "镜像仓库的空间名称"
        required: true
        default: "library"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QYWX_ROBOT_URL: "${{ secrets.QYWX_ROBOT_URL }}"
    steps:
      - name: Login to Docker Registry
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}" "${{ github.event.inputs.TARGET_REGISTRY }}"

      - name: Build, tag, and push Docker image
        run: |
          {
            printf "%s\\n" "# 构建阶段"
            printf "%s\\n" "FROM jrottenberg/ffmpeg:9-ubuntu AS builder"
            printf "%s\\n" ""
            printf "%s\\n" "LABEL maintainer=\"Qian Song <xxxxxxxxx@gmail.com>\""
            printf "%s\\n" ""
            printf "%s\\n" "WORKDIR /tmp"
            printf "%s\\n" ""
            printf "%s\\n" "# ensure local python is preferred over distribution python"
            printf "%s\\n" "ENV PATH=\"/usr/local/bin:\$PATH\""
            printf "%s\\n" ""
            printf "%s\\n" "# cannot remove LANG even though https://bugs.python.org/issue19846 is fixed"
            printf "%s\\n" "# - embedded interpreters (uWSGI, mod_wsgi, etc) skip locale coercion and UTF-8 mode before Python 3.15, so they fall back to ASCII"
            printf "%s\\n" "# - musl (alpine) never gets LC_CTYPE set, so anything that reads locale environment variables (babel) finds none"
            printf "%s\\n" "# last attempted removal of LANG broke many users:"
            printf "%s\\n" "# https://github.com/docker-library/python/pull/570"
            printf "%s\\n" "# embedded interpreter reproducer (fails with UnicodeEncodeError without LANG on 3.14 and earlier, needs a non-slim Debian variant for gcc):"
            printf "%s\\n" "# docker run --rm --env LANG= python:3.15 sh -c 'printf \"#include <Python.h>\nint main(){Py_Initialize();PyRun_SimpleString(\\\"print(chr(252),flush=True)\\\");}\" | gcc -x c - \$(python3-config --embed --cflags --ldflags) && ./a.out'"
            printf "%s\\n" "ENV LANG=\"C.UTF-8\""
            printf "%s\\n" ""
            printf "%s\\n" "# runtime dependencies"
            printf "%s\\n" "RUN set -eux; \\"
            printf "%s\\n" "        apt-get update; \\"
            printf "%s\\n" "        apt-get install -y --no-install-recommends \\"
            printf "%s\\n" "                libbluetooth-dev \\"
            printf "%s\\n" "                tk-dev \\"
            printf "%s\\n" "                uuid-dev \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        apt-get install -y --no-install-recommends \\"
            printf "%s\\n" "                ca-certificates \\"
            printf "%s\\n" "                curl \\"
            printf "%s\\n" "                wget \\"
            printf "%s\\n" "                vim-tiny \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        rm -rf /var/lib/apt/lists/*"
            printf "%s\\n" ""
            printf "%s\\n" "ENV PYTHON_VERSION=\"3.15.1\""
            printf "%s\\n" "ENV PYTHON_SHA256=\"673ae7232d84c894729882c8257d300ef2d26523911bfd3917ec8ce7f526f99b\""
            printf "%s\\n" ""
            printf "%s\\n" "RUN set -eux; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        savedAptMark=\"\$(apt-mark showmanual)\"; \\"
            printf "%s\\n" "        apt-get update; \\"
            printf "%s\\n" "        apt-get install -y --no-install-recommends \\"
            printf "%s\\n" "                libzstd-dev \\"
            printf "%s\\n" "                build-essential \\"
            printf "%s\\n" "                make \\"
            printf "%s\\n" "                pkg-config \\"
            printf "%s\\n" "                curl \\"
            printf "%s\\n" "                libssl-dev \\"
            printf "%s\\n" "                zlib1g-dev \\"
            printf "%s\\n" "                libbz2-dev \\"
            printf "%s\\n" "                libffi-dev \\"
            printf "%s\\n" "                libreadline-dev \\"
            printf "%s\\n" "                libsqlite3-dev \\"
            printf "%s\\n" "                libgdbm-dev \\"
            printf "%s\\n" "                libgdbm-compat-dev \\"
            printf "%s\\n" "                libncurses5-dev \\"
            printf "%s\\n" "                libncursesw5-dev \\"
            printf "%s\\n" "                liblzma-dev \\"
            printf "%s\\n" "                dpkg-dev \\"
            printf "%s\\n" "                findutils \\"
            printf "%s\\n" "                gnupg \\"
            printf "%s\\n" "                libbluetooth-dev \\"
            printf "%s\\n" "                tcl-dev \\"
            printf "%s\\n" "                tk-dev \\"
            printf "%s\\n" "                libtirpc-dev \\"
            printf "%s\\n" "                pax-utils \\"
            printf "%s\\n" "                tar \\"
            printf "%s\\n" "                tk \\"
            printf "%s\\n" "                util-linux \\"
            printf "%s\\n" "                xz-utils \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        wget -O python.tar.xz \"https://www.python.org/ftp/python/\${PYTHON_VERSION%%[a-z]*}/Python-\$PYTHON_VERSION.tar.xz\"; \\"
            printf "%s\\n" "        echo \"\$PYTHON_SHA256 *python.tar.xz\" | sha256sum -c -; \\"
            printf "%s\\n" "        mkdir -p /usr/src/python; \\"
            printf "%s\\n" "        tar --extract --directory /usr/src/python --strip-components=1 --file python.tar.xz; \\"
            printf "%s\\n" "        rm python.tar.xz; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        cd /usr/src/python; \\"
            printf "%s\\n" "        gnuArch=\"\$(dpkg-architecture --query DEB_BUILD_GNU_TYPE)\"; \\"
            printf "%s\\n" "        ./configure \\"
            printf "%s\\n" "                --build=\"\$gnuArch\" \\"
            printf "%s\\n" "                --enable-loadable-sqlite-extensions \\"
            printf "%s\\n" "                --enable-optimizations \\"
            printf "%s\\n" "                --enable-option-checking=fatal \\"
            printf "%s\\n" "                --enable-shared \\"
            printf "%s\\n" "                \$(test \"\${gnuArch%%-*}\" != 'riscv64' && echo '--with-lto') \\"
            printf "%s\\n" "                --with-ensurepip \\"
            printf "%s\\n" "# https://github.com/docker-library/python/pull/1137#issuecomment-6180817683"
            printf "%s\\n" "                --without-system-libmpdec \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        nproc=\"\$(nproc)\"; \\"
            printf "%s\\n" "        EXTRA_CFLAGS=\"\$(dpkg-buildflags --get CFLAGS)\"; \\"
            printf "%s\\n" "        LDFLAGS=\"\$(dpkg-buildflags --get LDFLAGS)\"; \\"
            printf "%s\\n" "        arch=\"\$(dpkg --print-architecture)\"; arch=\"\${arch##*-}\"; \\"
            printf "%s\\n" "# https://docs.python.org/3.12/howto/perf_profiling.html"
            printf "%s\\n" "# https://github.com/docker-library/python/pull/1000#issuecomment-2597021615"
            printf "%s\\n" "        case \"\$arch\" in \\"
            printf "%s\\n" "                amd64|arm64) \\"
            printf "%s\\n" "                        # only add \"-mno-omit-leaf\" on arches that support it"
            printf "%s\\n" "                        # https://gcc.gnu.org/onlinedocs/gcc-14.2.0/gcc/x86-Options.html#index-momit-leaf-frame-pointer-2"
            printf "%s\\n" "                        # https://gcc.gnu.org/onlinedocs/gcc-14.2.0/gcc/AArch64-Options.html#index-momit-leaf-frame-pointer"
            printf "%s\\n" "                        EXTRA_CFLAGS=\"\${EXTRA_CFLAGS:-} -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer\"; \\"
            printf "%s\\n" "                        ;; \\"
            printf "%s\\n" "                i386) \\"
            printf "%s\\n" "                        # don't enable frame-pointers on 32bit x86 due to performance drop."
            printf "%s\\n" "                        ;; \\"
            printf "%s\\n" "                *) \\"
            printf "%s\\n" "                        # other arches don't support \"-mno-omit-leaf\""
            printf "%s\\n" "                        EXTRA_CFLAGS=\"\${EXTRA_CFLAGS:-} -fno-omit-frame-pointer\"; \\"
            printf "%s\\n" "                        ;; \\"
            printf "%s\\n" "        esac; \\"
            printf "%s\\n" "        make -j \"\$nproc\" \\"
            printf "%s\\n" "                \"EXTRA_CFLAGS=\${EXTRA_CFLAGS:-}\" \\"
            printf "%s\\n" "                \"LDFLAGS=\${LDFLAGS:-}\" \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "# https://github.com/docker-library/python/issues/784"
            printf "%s\\n" "# prevent accidental usage of a system installed libpython of the same version"
            printf "%s\\n" "        rm python; \\"
            printf "%s\\n" "        make -j \"\$nproc\" \\"
            printf "%s\\n" "                \"EXTRA_CFLAGS=\${EXTRA_CFLAGS:-}\" \\"
            printf "%s\\n" "                \"LDFLAGS=\${LDFLAGS:-} -Wl,-rpath='\\$\\\$ORIGIN/../lib'\" \\"
            printf "%s\\n" "                python \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        make install; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "# enable GDB to load debugging data: https://github.com/docker-library/python/pull/701"
            printf "%s\\n" "        bin=\"\$(readlink -ve /usr/local/bin/python3)\"; \\"
            printf "%s\\n" "        dir=\"\$(dirname \"\$bin\")\"; \\"
            printf "%s\\n" "        mkdir -p \"/usr/share/gdb/auto-load/\$dir\"; \\"
            printf "%s\\n" "        cp -vL Tools/gdb/libpython.py \"/usr/share/gdb/auto-load/\$bin-gdb.py\"; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        cd /; \\"
            printf "%s\\n" "        rm -rf /usr/src/python; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        find /usr/local -depth \\"
            printf "%s\\n" "                \\( \\"
            printf "%s\\n" "                        \\( -type d -a \\( -name test -o -name tests -o -name idle_test \\) \\) \\"
            printf "%s\\n" "                        -o \\( -type f -a \\( -name '*.pyc' -o -name '*.pyo' -o -name 'libpython*.a' \\) \\) \\"
            printf "%s\\n" "                \\) -exec rm -rf '{}' + \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        ldconfig; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        apt-mark auto '.*' > /dev/null; \\"
            printf "%s\\n" "        apt-mark manual \$savedAptMark; \\"
            printf "%s\\n" "        find /usr/local -type f -executable -not \\( -name '*tkinter*' \\) -exec ldd '{}' ';' \\"
            printf "%s\\n" "                | awk '/=>/ { so = \$(NF-1); if (index(so, \"/usr/local/\") == 1) { next }; gsub(\"^/(usr/)?\", \"\", so); printf \"*%s\\n\", so }' \\"
            printf "%s\\n" "                | sort -u \\"
            printf "%s\\n" "                | xargs -rt dpkg-query --search \\"
            printf "%s\\n" "# https://manpages.debian.org/bookworm/dpkg/dpkg-query.1.en.html#S (we ignore diversions and it'll be really unusual for more than one package to provide any given .so file)"
            printf "%s\\n" "                | awk 'sub(\":\$\", \"\", \$1) { print \$1 }' \\"
            printf "%s\\n" "                | sort -u \\"
            printf "%s\\n" "                | xargs -r apt-mark manual \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        apt-get purge -y --auto-remove -o APT::AutoRemove::RecommendsImportant=false; \\"
            printf "%s\\n" "        rm -rf /var/lib/apt/lists/*; \\"
            printf "%s\\n" "        \\"
            printf "%s\\n" "        export PYTHONDONTWRITEBYTECODE=1; \\"
            printf "%s\\n" "        python3 --version; \\"
            printf "%s\\n" "        python3 -m pip install --no-cache-dir -U \"yt-dlp[default]\"; \\"
            printf "%s\\n" "        pip3 --version"
            printf "%s\\n" ""
            printf "%s\\n" "# make some useful symlinks that are expected to exist (\"/usr/local/bin/python\" and friends)"
            printf "%s\\n" "RUN set -eux; \\"
            printf "%s\\n" "        for src in idle3 pip3 pydoc3 python3 python3-config; do \\"
            printf "%s\\n" "                dst=\"\$(echo \"\$src\" | tr -d 3)\"; \\"
            printf "%s\\n" "                [ -s \"/usr/local/bin/\$src\" ]; \\"
            printf "%s\\n" "                [ ! -e \"/usr/local/bin/\$dst\" ]; \\"
            printf "%s\\n" "                ln -svT \"\$src\" \"/usr/local/bin/\$dst\"; \\"
            printf "%s\\n" "        done"
            printf "%s\\n" ""
            printf "%s\\n" "# 最终阶段"
            printf "%s\\n" "FROM jrottenberg/ffmpeg:9-ubuntu AS final"
            printf "%s\\n" ""
            printf "%s\\n" "LABEL maintainer=\"Qian Song <xxxxxxxxx@gmail.com>\""
            printf "%s\\n" ""
            printf "%s\\n" "WORKDIR /tmp"
            printf "%s\\n" ""
            printf "%s\\n" "# ensure local python is preferred over distribution python"
            printf "%s\\n" "ENV PATH=\"/usr/local/bin:\$PATH\""
            printf "%s\\n" ""
            printf "%s\\n" "# cannot remove LANG even though https://bugs.python.org/issue19846 is fixed"
            printf "%s\\n" "# - embedded interpreters (uWSGI, mod_wsgi, etc) skip locale coercion and UTF-8 mode before Python 3.15, so they fall back to ASCII"
            printf "%s\\n" "# - musl (alpine) never gets LC_CTYPE set, so anything that reads locale environment variables (babel) finds none"
            printf "%s\\n" "# last attempted removal of LANG broke many users:"
            printf "%s\\n" "# https://github.com/docker-library/python/pull/570"
            printf "%s\\n" "# embedded interpreter reproducer (fails with UnicodeEncodeError without LANG on 3.14 and earlier, needs a non-slim Debian variant for gcc):"
            printf "%s\\n" "# docker run --rm --env LANG= python:3.15 sh -c 'printf \"#include <Python.h>\nint main(){Py_Initialize();PyRun_SimpleString(\\\"print(chr(252),flush=True)\\\");}\" | gcc -x c - \$(python3-config --embed --cflags --ldflags) && ./a.out'"
            printf "%s\\n" "ENV LANG=\"C.UTF-8\""
            printf "%s\\n" ""
            printf "%s\\n" "# runtime dependencies"
            printf "%s\\n" "RUN set -eux; \\"
            printf "%s\\n" "        apt-get update; \\"
            printf "%s\\n" "        apt-get install -y --no-install-recommends \\"
            printf "%s\\n" "                ca-certificates \\"
            printf "%s\\n" "                curl \\"
            printf "%s\\n" "                wget \\"
            printf "%s\\n" "                vim-tiny \\"
            printf "%s\\n" "                tar \\"
            printf "%s\\n" "                unzip \\"
            printf "%s\\n" "        ; \\"
            printf "%s\\n" "        rm -rf /var/lib/apt/lists/*"
            printf "%s\\n" ""
            printf "%s\\n" "ENV PYTHON_VERSION=\"3.15.1\""
            printf "%s\\n" "ENV PYTHON_SHA256=\"673ae7232d84c894729882c8257d300ef2d26523911bfd3917ec8ce7f526f99b\""
            printf "%s\\n" ""
            printf "%s\\n" "# 从第一阶段直接复制编译好的 Python 环境及第三方包"
            printf "%s\\n" "COPY --from=builder /usr/local /usr/local"
            printf "%s\\n" ""
            printf "%s\\n" "# 更新动态链接库缓存"
            printf "%s\\n" "RUN ldconfig"
            printf "%s\\n" ""
            printf "%s\\n" "# make some useful symlinks that are expected to exist (\"/usr/local/bin/python\" and friends)"
            printf "%s\\n" "RUN set -eux; \\"
            printf "%s\\n" "        for src in idle3 pip3 pydoc3 python3 python3-config; do \\"
            printf "%s\\n" "                dst=\"\$(echo \"\$src\" | tr -d 3)\"; \\"
            printf "%s\\n" "                if [ -s \"/usr/local/bin/\$src\" ] && [ ! -e \"/usr/local/bin/\$dst\" ]; then \\"
            printf "%s\\n" "                        ln -svT \"\$src\" \"/usr/local/bin/\$dst\"; \\"
            printf "%s\\n" "                fi; \\"
            printf "%s\\n" "        done"
            printf "%s\\n" ""
            printf "%s\\n" "ENTRYPOINT [\"/bin/bash\"]"
          } >"Dockerfile"
          # 查看Dockerfile文件
          echo "<><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><>"
          cat Dockerfile
          echo "<><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><>"
          # 构建并推送镜像
          docker build -f Dockerfile -t "${{ github.event.inputs.TARGET_REGISTRY }}/${{ github.event.inputs.TARGET_REPOSITORY }}/${{ github.event.inputs.IMAGE_NAME }}:${{ github.event.inputs.IMAGE_VERSION }}" .
          docker push "${{ github.event.inputs.TARGET_REGISTRY }}/${{ github.event.inputs.TARGET_REPOSITORY }}/${{ github.event.inputs.IMAGE_NAME }}:${{ github.event.inputs.IMAGE_VERSION }}"

      - name: qyweixin send message
        if: ${{ env.QYWX_ROBOT_URL != '' }}
        uses: chf007/action-wechat-work@master
        env:
          WECHAT_WORK_BOT_WEBHOOK: "${{secrets.QYWX_ROBOT_URL}}"
          IMAGE_URL: "${{ github.event.inputs.TARGET_REGISTRY }}/${{ github.event.inputs.TARGET_REPOSITORY }}/${{ github.event.inputs.IMAGE_NAME }}:${{ github.event.inputs.IMAGE_VERSION }}"
        with:
          msgtype: markdown
          content: |
            # 镜像构建成功
            ```
            "${{ env.IMAGE_URL }}"
            ```
